<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a12">
<meta name="description" content="Erythmind: dunia 3D peribadi yang disulitkan dengan PIN.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Erythmind">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Erythmind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Cinzel:wght@600&family=EB+Garamond:wght@500&display=swap">
<style>
/* Layout: full-bleed 3D island canvas; HUD floats at the screen edges; vault panels slide in as glass sheets (bottom sheet on phones). */
:root{
  --void:#070a12; --panel:#0e1321; --panel-2:#151c2f; --line:#27314c;
  --ink:#e9edf6; --mute:#8f99b4;
  --eryth:#ff4f45; --holo:#6ff3ff; --amber:#ffb86b;
  --male:#3ddc84; --female:#ff6fb5; --ok:#5fe3a1; --warn:#ffc65c; --bad:#ff5a5a;
  --glass:rgba(14,19,33,.82); --glass-line:rgba(111,243,255,.18);
  --f-display:'Unbounded','Segoe UI',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --gl:max(16px, env(safe-area-inset-left, 0px));
  --gr:max(16px, env(safe-area-inset-right, 0px));
  --gt:calc(env(safe-area-inset-top, 0px) + 14px);
  --gb:calc(env(safe-area-inset-bottom, 0px) + 14px);
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--void);color:var(--ink);font:15px/1.5 var(--f-body);overflow:hidden;padding-left:var(--gl);padding-right:var(--gr);padding-block:0;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--holo);outline-offset:2px}
#world{position:fixed;inset:0;touch-action:none}
#world canvas{display:block;width:100%;height:100%}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;font:600 11px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:4px;background:rgba(7,10,18,.66);border:1px solid var(--glass-line);color:var(--ink);will-change:transform}
.lbl.zone{font:600 12px/1.25 var(--f-display);letter-spacing:.04em;text-transform:none;padding:6px 10px;border-color:var(--c,var(--holo));box-shadow:0 0 18px -6px var(--c,var(--holo))}
.lbl.zone small{display:block;font:500 10px/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.lbl.name{background:rgba(7,10,18,.5);border-color:transparent}
.lbl.name.owner{color:#ffd2cf;border-color:rgba(255,79,69,.5)}
.lbl.name.male{color:var(--male)}
.lbl.name.female{color:var(--female)}
.lbl.sat{color:var(--holo);background:rgba(7,10,18,.4)}

/* HUD */
.hud{position:fixed;z-index:5}
#brand{top:var(--gt);left:var(--gl);display:grid;gap:8px;max-width:min(380px,calc(100% - 180px));padding:12px 14px;border-radius:14px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(10px)}
#brand h1{margin:0;font:800 20px/1 var(--f-display);letter-spacing:.14em}
#brand h1 span{color:var(--eryth)}
#layerLine{font:600 11px/1.3 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--holo)}
#chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);font:600 10.5px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.chip.warn i{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.chip.bad i{background:var(--bad);box-shadow:0 0 8px var(--bad)}
button.chip:hover{border-color:var(--holo)}
#mapWrap{top:var(--gt);right:var(--gr);display:grid;justify-items:end;gap:6px}
#minimap{width:132px;height:132px;border-radius:50%;background:rgba(7,10,18,.7);border:1px solid var(--glass-line)}
#who{font:600 10.5px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);text-align:right;padding:4px 9px;border-radius:999px;background:var(--glass)}
#tools{right:var(--gr);bottom:var(--gb);display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.tbtn{display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:10px;background:var(--glass);border:1px solid var(--glass-line);font:600 12px/1 var(--f-body);letter-spacing:.02em;backdrop-filter:blur(8px)}
.tbtn:hover{border-color:var(--holo)}
.tbtn b{font:600 10px/1 var(--f-mono);padding:3px 5px;border-radius:4px;background:rgba(111,243,255,.12);color:var(--holo)}
.tbtn.on{border-color:var(--holo);box-shadow:0 0 16px -6px var(--holo)}
.tbtn.lock{border-color:rgba(255,79,69,.45)}
#hint{left:var(--gl);bottom:var(--gb);font:500 11.5px/1.6 var(--f-mono);color:var(--mute);max-width:340px;padding:8px 12px;border-radius:10px;background:var(--glass);border:1px solid var(--glass-line)}
#hint kbd{font:600 10.5px var(--f-mono);padding:1px 5px;border-radius:4px;border:1px solid var(--line);color:var(--ink)}
#act{left:50%;transform:translateX(-50%);bottom:calc(var(--gb) + 4px);padding:12px 18px;border-radius:12px;background:rgba(14,19,33,.9);border:1px solid var(--c,var(--holo));box-shadow:0 0 24px -8px var(--c,var(--holo));font:600 14px/1.2 var(--f-body);display:flex;gap:10px;align-items:center;max-width:calc(100% - 40px)}
#act b{font:600 11px var(--f-mono);padding:3px 7px;border-radius:5px;background:var(--c,var(--holo));color:var(--void)}
#joy{position:fixed;z-index:6;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:1px solid var(--glass-line);background:rgba(111,243,255,.06);pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(111,243,255,.35);border:1px solid var(--holo)}
#flash{position:fixed;inset:0;z-index:8;pointer-events:none;opacity:0;transition:opacity .5s}
#toast{position:fixed;z-index:30;left:50%;top:calc(var(--gt) + 4px);transform:translateX(-50%);display:grid;gap:6px;justify-items:center;pointer-events:none;width:min(520px,calc(100% - 32px))}
.toast{padding:10px 14px;border-radius:10px;background:rgba(14,19,33,.95);border:1px solid var(--glass-line);font:500 13.5px/1.4 var(--f-body);animation:tin .25s ease-out;text-align:center}
.toast.bad{border-color:var(--bad);color:#ffd1d1}
.toast.ok{border-color:var(--ok)}
@keyframes tin{from{transform:translateY(-6px);opacity:0}}

/* Panels */
#panel{position:fixed;z-index:20;top:calc(var(--gt) - 4px);bottom:var(--gb);right:var(--gr);width:min(600px,calc(100% - 32px));display:flex;flex-direction:column;background:var(--glass);border:1px solid var(--glass-line);border-radius:16px;backdrop-filter:blur(14px);box-shadow:0 30px 80px -20px rgba(0,0,0,.6);animation:pin .28s cubic-bezier(.2,.8,.2,1)}
@keyframes pin{from{transform:translateX(24px);opacity:0}}
.ph{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:grid;gap:4px;position:relative}
.eyebrow{font:600 10.5px/1.3 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--c,var(--holo))}
.ph h2{margin:0;font:600 21px/1.2 var(--f-display);text-wrap:balance;padding-right:40px}
.ph p{margin:2px 0 0;color:var(--mute);font-size:13.5px;max-width:60ch}
.x{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:transparent;font-size:18px;line-height:1}
.x:hover{border-color:var(--holo)}
.pb{padding:16px 20px 20px;overflow:auto;display:grid;gap:16px;align-content:start;flex:1;min-height:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{padding:9px 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);font-weight:600;font-size:13.5px}
.btn:hover{border-color:var(--holo)}
.btn.pri{background:var(--c,var(--eryth));border-color:transparent;color:#120707}
.btn.pri:hover{filter:brightness(1.1)}
.btn.danger{border-color:rgba(255,90,90,.5);color:#ffc4c4}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:grid;gap:5px;min-width:0}
.field label{font:600 10.5px/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.field input,.field select,.field textarea{width:100%;box-sizing:border-box;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:rgba(7,10,18,.6);font-size:14.5px}
.field textarea{min-height:120px;resize:vertical;line-height:1.55}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--c,var(--holo));outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.zgrid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:16px;align-items:start}
.list{display:grid;gap:6px;align-content:start}
.item{display:grid;gap:2px;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(7,10,18,.45);min-width:0}
.item:hover,.item.sel{border-color:var(--c,var(--holo))}
.item strong{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item span{font:500 11px/1.3 var(--f-mono);color:var(--mute);letter-spacing:.04em}
.item.bad{border-color:rgba(255,90,90,.5)}
.empty{padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--mute);font-size:13.5px}
.empty b{color:var(--ink)}
.note{font-size:12.5px;color:var(--mute);line-height:1.5}
.note.warn{color:var(--warn)}
.ro{padding:14px;border-radius:12px;border:1px solid var(--line);background:rgba(7,10,18,.45);display:grid;gap:10px}
.ro dt{font:600 10.5px/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.ro dd{margin:0 0 6px;white-space:pre-wrap;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.stat{padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(7,10,18,.45);display:grid;gap:2px}
.stat b{font:600 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font:600 10.5px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.stat i{font-style:normal;font-size:12px;color:var(--mute)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--holo))}
.sats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.sat{padding:10px 12px;border-radius:10px;border:1px solid var(--line);display:grid;gap:2px}
.sat strong{font:600 13px/1.2 var(--f-display);letter-spacing:.06em;color:var(--holo)}
.sat span{font-size:12.5px;color:var(--mute)}
.sat.synced{border-color:rgba(111,243,255,.45)}
h3{margin:0;font:600 13px/1.3 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.seg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(7,10,18,.45);display:grid;gap:4px;text-align:left}
.card:hover{border-color:var(--holo)}
.card.sel{border-color:var(--holo);box-shadow:0 0 18px -8px var(--holo)}
.card strong{font-weight:600}
.card span{font-size:12.5px;color:var(--mute)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;font-weight:600;font-size:13px}
.tab.on{border-color:var(--holo);color:var(--holo)}
.guest{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid var(--line);flex-wrap:wrap}
.guest .arrow{width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:12px solid var(--male);flex:none}
.guest .arrow.female{border-top-color:var(--female)}
.guest div{flex:1;min-width:140px}
.guest strong{display:block}
.guest span{font-size:12px;color:var(--mute)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;gap:6px;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;text-transform:none;letter-spacing:0;font-family:var(--f-body);color:var(--ink)}
.dish{display:grid;place-items:center;gap:8px;padding:18px;border-radius:14px;border:1px solid var(--glass-line);background:radial-gradient(circle at 50% 70%,rgba(111,243,255,.18),transparent 60%)}
.dish .plate{font-size:54px;line-height:1;filter:drop-shadow(0 0 14px rgba(111,243,255,.6))}
.dish strong{font:600 16px var(--f-display)}
.cook{height:6px;border-radius:3px;background:var(--line);overflow:hidden;width:100%}
.cook i{display:block;height:100%;width:0;background:var(--holo);transition:width 1.1s linear}
#arcade{width:100%;max-width:100%;aspect-ratio:16/10;border-radius:12px;border:1px solid var(--line);background:#050811;touch-action:none}
pre.code{margin:0;max-height:140px;overflow:auto;padding:10px;border-radius:10px;border:1px solid var(--line);background:rgba(7,10,18,.6);font:12px/1.5 var(--f-mono);white-space:pre-wrap;overflow-wrap:anywhere}
ul.facts{margin:0;padding-left:18px;display:grid;gap:6px;font-size:13.5px}
ul.facts b{color:var(--holo);font-weight:600}

/* Gate */
#gate{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:var(--gt) var(--gr) var(--gb) var(--gl);background:radial-gradient(ellipse at 50% 45%,rgba(7,10,18,.25),rgba(7,10,18,.82) 75%),url(assets/peta-ekspedisi.webp) center/cover no-repeat,var(--void);overflow:auto}
.gcard{width:min(400px,100%);display:grid;gap:16px;justify-items:center;text-align:center;padding:26px 22px;border-radius:20px;background:rgba(10,14,25,.82);border:1px solid rgba(255,79,69,.35);box-shadow:0 0 60px -20px rgba(255,79,69,.6);backdrop-filter:blur(10px)}
.gcard h1{margin:0;font:800 30px/1 var(--f-display);letter-spacing:.16em}
.gcard h1 span{color:var(--eryth)}
.gsub{font:600 11px/1.4 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--holo)}
.gmsg{font-size:14px;color:var(--mute);max-width:34ch;text-wrap:balance}
.gmsg.bad{color:#ffb4b4}
.dots{display:flex;gap:9px;min-height:16px;justify-content:center;flex-wrap:wrap}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line)}
.dots i.f{background:var(--eryth);border-color:var(--eryth);box-shadow:0 0 10px var(--eryth)}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:10px}
.pad button{height:56px;border-radius:14px;border:1px solid var(--line);background:rgba(21,28,47,.85);font:600 20px var(--f-display)}
.pad button:hover{border-color:var(--holo)}
.pad button:active{transform:scale(.96)}
.pad button.ok{background:var(--eryth);border-color:transparent;color:#120707;font-size:13px;font-family:var(--f-mono)}
.pad button.del{font-size:13px;font-family:var(--f-mono)}
.scan{width:100%;height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--holo),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:scan 1s linear infinite}
@keyframes scan{from{background-position:-40% 0}to{background-position:140% 0}}
.denied{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}


.lbl.district{font:700 13px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:7px 12px;background:rgba(7,10,18,.72);border:1px solid rgba(233,237,246,.35);color:var(--ink)}
.lbl.district small{display:block;font:500 10px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:none;color:var(--mute)}
#clock{display:grid;gap:2px;text-align:right;padding:6px 10px;border-radius:12px;background:var(--glass);border:1px solid var(--glass-line);cursor:pointer}
#clockTime{font:700 18px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
#clockNext{font:600 10.5px/1.3 var(--f-mono);letter-spacing:.06em;color:#ffd27a}
#azan{position:fixed;z-index:25;left:50%;transform:translateX(-50%);top:calc(var(--gt) + 64px);width:min(460px,calc(100% - 32px));display:grid;gap:10px;padding:16px 18px;border-radius:16px;background:rgba(14,19,33,.94);border:1px solid #ffd27a;box-shadow:0 0 40px -12px #ffd27a;animation:tin .3s ease-out}
#azan strong{font:600 17px/1.3 var(--f-display)}
a.btn,a.card{text-decoration:none;color:inherit;display:inline-flex}
a.card{display:grid}
.stat.next{border-color:#ffd27a;box-shadow:0 0 16px -8px #ffd27a}

/* Peta Ekspedisi */
#map{position:fixed;inset:0;z-index:30;background:rgba(5,7,12,.92);display:grid;place-items:center;padding:var(--gt) var(--gr) var(--gb) var(--gl);animation:tin .3s ease-out}
#mapFrame{position:relative;width:min(100%,calc((100vh - 120px) * 1.787));aspect-ratio:1344/752;max-width:100%;border-radius:18px;overflow:hidden;border:1px solid rgba(255,210,122,.4);box-shadow:0 30px 90px -20px rgba(0,0,0,.8),0 0 60px -20px rgba(255,170,90,.5)}
#mapImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#mapFrame::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,10,18,.35),transparent 18%,transparent 80%,rgba(7,10,18,.55));pointer-events:none}
#mapHead{position:absolute;left:16px;top:12px;z-index:2;display:grid;gap:2px;pointer-events:none}
#mapHead strong{font:800 clamp(14px,2.2vw,22px)/1 var(--f-display);letter-spacing:.14em;text-shadow:0 2px 12px rgba(0,0,0,.7)}
#mapHead span{font:600 10.5px/1.3 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:#ffd27a;text-shadow:0 1px 8px rgba(0,0,0,.8)}
#mapX{position:absolute;right:12px;top:12px;z-index:3;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:rgba(7,10,18,.7);font-size:20px}
#mapPins{position:absolute;inset:0;z-index:2}
.pin{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0}
.pin i{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,#fff 0 25%,#ffd27a 35%,rgba(255,210,122,.25) 70%);box-shadow:0 0 0 0 rgba(255,210,122,.7);animation:pulse 2.2s infinite}
.pin.l1 i{background:radial-gradient(circle,#fff 0 25%,#ff4f45 35%,rgba(255,79,69,.25) 70%);box-shadow:0 0 0 0 rgba(255,79,69,.7)}
.pin.l2 i{background:radial-gradient(circle,#fff 0 25%,#8fe0ff 35%,rgba(143,224,255,.25) 70%);box-shadow:0 0 0 0 rgba(143,224,255,.7)}
.pin span{font:600 10.5px/1.2 var(--f-mono);letter-spacing:.06em;padding:3px 7px;border-radius:6px;background:rgba(7,10,18,.72);border:1px solid rgba(255,255,255,.18);white-space:nowrap;opacity:.88}
.pin:hover span,.pin.sel span{opacity:1;border-color:#ffd27a;color:#fff}
.pin.sel i{transform:scale(1.4)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,210,122,.6)}70%{box-shadow:0 0 0 14px rgba(255,210,122,0)}100%{box-shadow:0 0 0 0 rgba(255,210,122,0)}}
#mapCard{position:absolute;z-index:4;left:50%;bottom:14px;transform:translateX(-50%);width:min(560px,calc(100% - 24px));display:grid;gap:8px;padding:14px 16px;border-radius:14px;background:rgba(10,14,25,.93);border:1px solid rgba(255,210,122,.45);backdrop-filter:blur(10px)}
#mapCard strong{font:600 18px/1.2 var(--f-display)}
/* ride HUD */
